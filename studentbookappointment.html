<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Appointment - PLMUN</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="studentbookappointment.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="sidebar">
    <div>
      <div class="brand-section">
        <img src="plmunlogo.png" alt="PLMUN Logo" class="brand-logo">
        <p class="brand-title">Pamantasan ng Lungsod ng Muntinlupa</p>
        <h1 class="brand-name">PLMUN</h1>
        <span class="badge">Student Account</span>
      </div>
      <ul class="nav-links">
        <li><a href="studentdashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>
        <li><a href="studentjoinqueue.html"><i class="fa-solid fa-list-check"></i> Join Queue</a></li>
        <li><a href="studentstatus.html"><i class="fa-solid fa-clock"></i> Queue Status</a></li>
        <li><a href="studentbookappointment.html" class="active"><i class="fa-solid fa-calendar-days"></i> Book Appointment</a></li>
        <li><a href="studentnotification.html"><i class="fa-solid fa-bell"></i> Notification</a></li>
        <li><a href="studentrequirement.html"><i class="fa-solid fa-file-lines"></i> Requirements</a></li>
      </ul>
    </div>
    <button class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Log Out</button>
  </div>

  <div class="main-content">
    <div class="top-bar">
      <h2><i class="fa-solid fa-calendar-plus"></i> Book Appointment</h2>
      <span>Schedule a visit for document release or consultation</span>
    </div>

    <div class="card form-card">
      <h3 class="card-title mb-20"><i class="fa-solid fa-calendar-check"></i> Schedule Details</h3>
      <div class="form-group">
        <label for="app-date"><i class="fa-solid fa-calendar"></i> Select Date</label>
        <input type="date" id="app-date" class="form-control">
      </div>
      <div class="form-group">
        <label for="app-time"><i class="fa-solid fa-clock"></i> Select Time Slot</label>
        <select id="app-time" class="form-control">
          <option>09:00 AM - 10:00 AM</option>
          <option>10:00 AM - 11:00 AM</option>
          <option>01:00 PM - 02:00 PM</option>
        </select>
      </div>
      <button class="btn-primary mt-15"><i class="fa-solid fa-check"></i> Confirm Appointment</button>
    </div>
  </div>
</body>
</html>
