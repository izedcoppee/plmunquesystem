<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Queue Status - PLMUN</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="studentstatus.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="sidebar">
    <div>
      <div class="brand-section">
        <img src="plmunlogo.png" alt="PLMUN Logo" class="brand-logo">
        <p class="brand-title">Pamantasan ng Lungsod ng Muntinlupa</p>
        <h1 class="brand-name">PLMUN</h1>
        <span class="badge">Student Account</span>
      </div>
      <ul class="nav-links">
        <li><a href="studentdashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>
        <li><a href="studentjoinqueue.html"><i class="fa-solid fa-list-check"></i> Join Queue</a></li>
        <li><a href="studentstatus.html" class="active"><i class="fa-solid fa-clock"></i> Queue Status</a></li>
        <li><a href="studentbookappointment.html"><i class="fa-solid fa-calendar-days"></i> Book Appointment</a></li>
        <li><a href="studentnotification.html"><i class="fa-solid fa-bell"></i> Notification</a></li>
        <li><a href="studentrequirement.html"><i class="fa-solid fa-file-lines"></i> Requirements</a></li>
      </ul>
    </div>
    <button class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Log Out</button>
  </div>

  <div class="main-content">
    <div class="top-bar">
      <h2><i class="fa-solid fa-clock"></i> Live Queue Status</h2>
      <span>Track live transactions in real-time</span>
    </div>

    <div class="card live-status-card">
      <div class="icon-box bg-orange icon-large">
        <i class="fa-solid fa-ticket"></i>
      </div>
      <div class="stat-title">Your Active Queue Number</div>
      <div class="queue-display">Q-006</div>
      <div class="status-badge"><i class="fa-solid fa-spinner fa-spin"></i> Waiting in Line (2 people ahead)</div>
    </div>
  </div>
</body>
</html>
